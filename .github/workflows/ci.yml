name: Iskra CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  policy:
    name: Branch policy
    runs-on: ubuntu-24.04
    outputs:
      sync_skip: ${{ steps.sync.outputs.skip }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 scripts/branch-policy.py
      - name: Detect exact main-synced dev fast-forward
        id: sync
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          REPO_NAME: ${{ github.repository }}
        run: |
          skip=false
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "refs/heads/dev" ] && [ "$REPO_NAME" = "Energy-Quant/Iskra" ]; then
            head_sha="$(git rev-parse --verify -q HEAD || true)"
            main_sha="$(git rev-parse --verify -q refs/remotes/origin/main || true)"
            if [ -n "$head_sha" ] && [ "$head_sha" = "$main_sha" ]; then
              skip=true
              echo "Exact commit SHA matches refs/remotes/origin/main ($head_sha); skipping duplicate dev sync build."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  linux:
    needs: [policy]
    if: needs.policy.outputs.sync_skip != 'true'
    uses: ./.github/workflows/linux.yml
  portable:
    needs: [policy]
    if: needs.policy.outputs.sync_skip != 'true'
    name: Portable (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux}
          - {os: windows-2025, platform: windows}
          - {os: macos-15, platform: macos}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: Pillow==13.0.0
      - run: |
          python -m unittest discover -s scripts/tests -p test_portable.py
          python -m unittest discover -s scripts/tests -p test_promotion.py
      - name: Build portable plugin staging and avatar toolkit
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python scripts/build-plugin.py --wait 0 --output dist/staging
          version="$(python -c 'import json; print(json.load(open("plugin/iskra/zeron-plugin.json", encoding="utf-8"))["version"])')"
          python scripts/package-portable.py --source "dist/staging/iskra-$version" --output "dist/packages/iskra-plugin-UNSIGNED-$PLATFORM.zip"
          python scripts/prepare-toolkit.py dist/toolkit
          python scripts/package-portable.py --source dist/toolkit --output "dist/packages/iskra-avatar-tools-$PLATFORM.zip"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: iskra-portable-${{ matrix.platform }}
          path: dist/packages/
          if-no-files-found: error
          retention-days: 14
  contents:
    name: Artifact contract
    needs: [policy, linux, portable]
    if: needs.policy.outputs.sync_skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist/contracts
      - run: python3 scripts/check-artifacts.py dist/contracts
  gate:
    name: CI Gate
    if: always() && needs.policy.outputs.sync_skip != 'true'
    needs: [policy, linux, portable, contents]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failures = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failures:
              raise SystemExit(str(failures))
          print('Every required job succeeded; no skipped/cancelled check is accepted.')
          PYTHON
