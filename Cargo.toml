[package]
name = "zeron-pet"
version = "0.2.2"
edition = "2021"
description = "Independent transparent Wayland desktop pet reporting Zeron chat status"
license = "MIT"
build = "build.rs"

[lib]
name = "zeron_pet"
path = "src/lib.rs"

[[bin]]
name = "zeron-pet"
path = "src/main.rs"

[[bin]]
name = "zeron-pet-prepare-assets"
path = "src/bin/prepare_assets.rs"

[[bin]]
name = "zeron-pet-devin-mcp"
path = "src/bin/devin_mcp.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
gif = "0.13.3"
log = "0.4"
env_logger = "0.11"

# The GTK4 + gtk4-layer-shell desktop is Wayland-only; Windows uses the
# layered-window backend instead (src/desktop_win.rs).
[target.'cfg(unix)'.dependencies]
gtk4 = "0.9.7"
gio = { version = "0.20.12", features = ["v2_80"] }
gdk-pixbuf = "0.20.10"
cairo-rs = "0.20.12"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
